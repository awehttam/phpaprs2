<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1abc9c">
    <meta name="description" content="Real-time APRS-IS station tracking and mapping">
    <title>APRS-IS Live Map</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

    <!-- Font Awesome for symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Map container -->
        <div id="map"></div>

        <!-- Sidebar -->
        <div id="sidebar">
            <!-- Header -->
            <div id="header">
                <h1>
                    <i class="fas fa-satellite-dish"></i>
                    APRS-IS Live
                </h1>
                <div id="status">
                    <div class="status-item">
                        <i class="fas fa-signal" id="connection-icon"></i>
                        <span id="connection-status" class="disconnected">Connecting...</span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="station-count">0 stations</span>
                    </div>
                </div>
            </div>

            <!-- Station list -->
            <div id="station-list-container">
                <div id="station-list-header">
                    <input type="text" id="search-input" placeholder="Search callsigns...">
                </div>
                <div id="station-list">
                    <div class="empty-message">
                        <i class="fas fa-satellite-dish fa-2x"></i>
                        <p>Waiting for stations...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control buttons -->
        <div id="controls">
            <button id="toggle-tracks" title="Toggle Tracks" class="active">
                <i class="fas fa-route"></i>
            </button>
            <button id="toggle-labels" title="Toggle Labels" class="active">
                <i class="fas fa-tag"></i>
            </button>
            <button id="center-map" title="Center Map">
                <i class="fas fa-crosshairs"></i>
            </button>
            <button id="toggle-sidebar" title="Toggle Sidebar">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Info panel (appears when no sidebar) -->
        <div id="info-panel" style="display: none;">
            <div id="info-content">
                <span id="connection-status-mini" class="disconnected">Disconnected</span>
                <span id="station-count-mini">0</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <!-- Application JavaScript -->
    <script src="js/sse-client.js"></script>
    <script src="js/map-manager.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('[SW] Registered successfully:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('[SW] Registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
